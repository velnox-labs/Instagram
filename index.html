<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<title>Insta Clone — Velnox Labs</title>
<style>
  :root{
    --bg:#000000;
    --card:#0a0a0a;
    --border:#262626;
    --text:#f5f5f5;
    --muted:#a8a8a8;
    --accent:#e1306c;
    --grad-start:#feda75;
    --grad-mid:#d62976;
    --grad-end:#4f5bd5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:110px;
    -webkit-tap-highlight-color:transparent;
  }

  /* Top bar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;
  }
  .topbar .logo{
    font-family:'Brush Script MT',cursive,serif;
    font-size:30px;font-weight:600;letter-spacing:0.5px;
  }
  .icon-btn{
    background:none;border:none;color:var(--text);cursor:pointer;
    display:flex;align-items:center;
  }
  svg.ig{stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  svg.ig.filled{fill:var(--text);stroke:none;}

  /* Stories */
  .stories{
    display:flex;gap:16px;overflow-x:auto;padding:6px 16px 16px;
    scrollbar-width:none;
  }
  .stories::-webkit-scrollbar{display:none;}
  .story{
    display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;
    width:66px;
  }
  .story-ring{
    width:62px;height:62px;border-radius:50%;
    padding:2.5px;
    background:linear-gradient(45deg,var(--grad-start),var(--grad-mid),var(--grad-end));
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .story-ring.seen{background:#3a3a3a;}
  .story-ring img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;
    border:2.5px solid #000;
  }
  .story-plus{
    position:absolute;bottom:-2px;right:-2px;
    background:#3897f0;color:#fff;border-radius:50%;
    width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    font-size:14px;border:2px solid #000;
  }
  .story span{font-size:11.5px;color:var(--muted);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66px;}

  /* Post */
  .post{border-top:1px solid var(--border);}
  .post-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;
  }
  .post-user{display:flex;align-items:center;gap:10px;}
  .post-user img{width:32px;height:32px;border-radius:50%;object-fit:cover;
    border:2px solid var(--grad-mid);padding:1px;}
  .post-user .names{display:flex;flex-direction:column;line-height:1.25;}
  .post-user .uname{font-size:13.5px;font-weight:600;}
  .post-user .sub{font-size:11.5px;color:var(--muted);}
  .post-media{position:relative;width:100%;aspect-ratio:1/1;background:#111;}
  .post-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .post-counter{
    position:absolute;top:14px;right:14px;
    background:rgba(0,0,0,0.55);color:#fff;font-size:12px;
    padding:3px 9px;border-radius:12px;
  }
  .post-actions{display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px 4px;}
  .actions-left{display:flex;gap:20px;align-items:center;}
  .actions-left span, .save{cursor:pointer;display:flex;align-items:center;}
  .act{gap:6px;}
  .act b{font-size:15px;font-weight:400;}
  .ic{display:block;}
  .ic-h28{height:28px;width:auto;}
  .post-stats{padding:2px 12px;font-size:13.5px;color:var(--muted);
    display:flex;gap:14px;}
  .post-caption{padding:6px 12px 4px;font-size:13.5px;}
  .post-caption b{margin-right:6px;}
  .post-caption .more{color:var(--muted);}
  .post-dots{display:flex;gap:5px;justify-content:center;padding:10px 0 6px;}
  .post-dots span{width:5px;height:5px;border-radius:50%;background:#4a4a4a;}
  .post-dots span.active{background:#3897f0;width:6px;height:6px;}

  /* Ad-ish sponsored strip like screenshot */
  .sponsored{
    display:flex;align-items:center;gap:10px;
    background:#1a1a1a;padding:12px;margin-top:6px;
  }
  .sponsored img{width:34px;height:34px;border-radius:50%;object-fit:cover;}
  .sponsored .txt b{font-size:13px;}
  .sponsored .txt span{display:block;font-size:11.5px;color:var(--muted);}

  /* Bottom nav */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    background:#000;border-top:1px solid var(--border);
    display:flex;justify-content:space-around;align-items:center;
    padding:12px 0 18px;
  }
  .bottomnav .navicon{display:flex;align-items:center;justify-content:center;}
  .bottomnav img.profile-nav{
    width:26px;height:26px;border-radius:50%;object-fit:cover;
    border:1.5px solid var(--text);
  }

  .edit-hint{
    text-align:center;color:var(--muted);font-size:11px;padding:10px 20px 0;
  }
</style>
</head>
